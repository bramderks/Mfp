name: Archive Kyocera brochures

on:
  push:
    paths-ignore:
      - "brochures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official datasheets
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re
          from pathlib import Path
          from urllib.parse import urljoin
          from urllib.request import Request, urlopen

          products = [
            ("taskalfa-mz7001i", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQU1aNzAwMUk%3D.html", "MZ7001i", "taskalfa-mz7001i.pdf"),
            ("ecosys-ma3500cix", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9FQ09TWVNNQTM1MDBDSVg%3D.html", "MA3500cix", "ecosys-ma3500cix.pdf"),
            ("taskalfa-308ci", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQTMwOENJ.html", "308ci", "taskalfa-308ci.pdf"),
            ("taskalfa-358ci", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQTM1OENJ.html", "358ci", "taskalfa-358ci.pdf"),
            ("taskalfa-408ci", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQTQwOENJ.html", "408ci", "taskalfa-408ci.pdf"),
            ("taskalfa-508ci", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQTUwOENJ.html", "508ci", "taskalfa-508ci.pdf"),
            ("taskalfa-7353ci", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQTczNTNDSQ%3D%3D.html", "7353ci", "taskalfa-7353ci.pdf"),
            ("taskalfa-8353ci", "https://www.kyoceradocumentsolutions.nl/nl/support/downloads.name-L25sL25sL21mcC9UQVNLQUxGQTgzNTNDSQ%3D%3D.html", "8353ci", "taskalfa-8353ci.pdf"),
          ]
          out=Path("brochures"); out.mkdir(exist_ok=True)
          rows=[]
          for slug,page,token,target in products:
              source=urlopen(Request(page,headers={"User-Agent":"Mozilla/5.0"}),timeout=45).read().decode("utf-8","ignore")
              source=html.unescape(source)
              objects=re.findall(r'\{[^{}]{0,12000}?"title":"[^"]*Datasheet[^"}]*"[^{}]{0,12000}?\}',source,re.I)
              candidates=[]
              for obj in objects:
                  m=re.search(r'"dcLink":"([^"]+\\.pdf)"',obj,re.I)
                  f=re.search(r'"fileName":"([^"]*'+re.escape(token)+r'[^"}]*)"',obj,re.I)
                  if m and f: candidates.append((urljoin(page,m.group(1)),f.group(1)))
              if not candidates:
                  # Fallback: locate the token near any PDF download link in the page source.
                  for m in re.finditer(re.escape(token),source,re.I):
                      window=source[max(0,m.start()-5000):m.start()+5000]
                      dm=re.search(r'"dcLink":"([^"]+\\.pdf)"',window,re.I)
                      if dm: candidates.append((urljoin(page,dm.group(1)),token+".pdf"); break
              if not candidates: raise SystemExit(f"Could not locate datasheet for {slug}")
              pdf_url,_=candidates[0]
              data=urlopen(Request(pdf_url,headers={"User-Agent":"Mozilla/5.0"}),timeout=90).read()
              if not data.startswith(b"%PDF"): raise SystemExit(f"Not a PDF for {slug}: {pdf_url}")
              (out/target).write_bytes(data)
              rows.append(f"{slug}|{pdf_url}")
              print(f"Archived {slug}: {pdf_url}")
          (out/"SOURCES.txt").write_text("\\n".join(rows)+"\\n",encoding="utf-8")
          PY
      - name: Commit archived brochures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brochures
          git diff --cached --quiet && exit 0
          git commit -m "Archive Kyocera MFP brochures"
          git push
