name: Archive Kyocera brochures

on:
  push:
    paths-ignore:
      - "brochures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official datasheets
        run: |
          set -euo pipefail
          mkdir -p brochures
          download() {
            url="$1"; file="$2"
            echo "Downloading $file"
            curl --fail --location --retry 3 --retry-all-errors --user-agent "Mozilla/5.0" "$url" -o "brochures/$file"
            test -s "brochures/$file"
            head -c 4 "brochures/$file" | grep -q "%PDF"
          }
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_MZ7001i_pdf.download.pdf" "taskalfa-mz7001i.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_ECOSYS_MA3500cix_pdf.download.pdf" "ecosys-ma3500cix.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_308ci_nl_pdf.download.pdf" "taskalfa-308ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_358ci_nl_pdf.download.pdf" "taskalfa-358ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_408ci_nl_pdf.download.pdf" "taskalfa-408ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_508ci_nl_pdf.download.pdf" "taskalfa-508ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_7353ci_nl_pdf.download.pdf" "taskalfa-7353ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_8353ci_nl_pdf.download.pdf" "taskalfa-8353ci.pdf"
          cat > brochures/SOURCES.txt <<'EOF'
          taskalfa-mz7001i|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMZ7001I.html
          ecosys-ma3500cix|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/ECOSYSMA3500CIX.html
          taskalfa-308ci|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFA308CI.html
          taskalfa-358ci|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFA358CI.html
          taskalfa-408ci|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFA408CI.html
          taskalfa-508ci|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFA508CI.html
          taskalfa-7353ci|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFA7353CI.html
          taskalfa-8353ci|https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFA8353CI.html
          EOF
      - name: Commit archived brochures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brochures
          git diff --cached --quiet && exit 0
          git commit -m "Archive Kyocera MFP brochures"
          git push
