# Archives the official Kyocera datasheets/brochures used as source material for the ISELTO catalogue.
name: Archive Kyocera brochures

on:
  push:
    paths-ignore:
      - "brochures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official Kyocera documents
        run: |
          set -euo pipefail
          mkdir -p brochures

          download() {
            url="$1"
            file="$2"
            curl --fail --location --retry 3 --silent --show-error "$url" -o "brochures/$file"
            file "brochures/$file" | grep -q "PDF document"
          }

          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_MA3500ci_pdf.download.pdf" "taskalfa-ma3500ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_MA4500ci_pdf.download.pdf" "taskalfa-ma4500ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/brochure/Brochure_TASKalfa_MZ2501ci_serie_pdf.download.pdf" "taskalfa-mz2501ci-serie.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_MZ3200i_pdf.download.pdf" "taskalfa-mz3200i.pdf"
          download "https://www.kyoceradocumentsolutions.eu/content/dam/download-center-cf/eu/documents/datasheet/TASKalfa_MZ3501ci_datasheet_pdf.download.pdf" "taskalfa-mz3501ci.pdf"
          download "https://www.kyoceradocumentsolutions.nl/content/dam/download-center-cf/nl/documents/datasheet/Datasheet_TASKalfa_MZ4000i_pdf.download.pdf" "taskalfa-mz4000i.pdf"
          download "https://www.kyoceradocumentsolutions.eu/content/dam/download-center-cf/eu/documents/datasheet/datasheet-taskalfa-mz10500i.download.pdf" "taskalfa-mz10500i.pdf"

          cat > brochures/SOURCES.txt <<'EOF'
          TASKalfa MA3500ci | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMA3500CI.html
          TASKalfa MA4500ci | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMA4500CI.html
          TASKalfa MZ2501ci series | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMZ2501CI.html
          TASKalfa MZ3200i | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMZ3200I.html
          TASKalfa MZ3501ci | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMZ3501CI.html
          TASKalfa MZ4000i | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMZ4000I.html
          TASKalfa MZ10500i | https://www.kyoceradocumentsolutions.nl/nl/products/mfp/TASKALFAMZ10500I.html
          EOF

      - name: Commit archived brochures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brochures
          git diff --cached --quiet && exit 0
          git commit -m "Archive additional Kyocera MFP documents"
          git push
