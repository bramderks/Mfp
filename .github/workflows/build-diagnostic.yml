name: Build diagnostic

on:
  push:
    paths-ignore:
      - "diagnostics/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          mkdir -p diagnostics
          npm install --no-audit --no-fund > diagnostics/install.log 2>&1
      - name: Run production build
        run: |
          set +e
          npx next build > diagnostics/build.log 2>&1
          status=$?
          echo "BUILD_EXIT_CODE=$status" >> diagnostics/build.log
          exit 0
      - name: Commit build log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/build.log diagnostics/install.log
          git diff --cached --quiet && exit 0
          git commit -m "Add build diagnostic log"
          git push
